name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      # On a release tag the build creates the release and each platform job
      # attaches its own files as soon as it finishes.
      contents: write

  create-release:
    name: Add Release Checksums 🪪
    if: needs.build-project.outputs.releaseTag != ''
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Add Checksums 🪪
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-project.outputs.releaseTag }}
        run: |
          : Add Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # GitHub records each asset's SHA-256 on upload.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '"### Checksums", (.assets[] | "    \(.name): \(.digest // "" | ltrimstr("sha256:"))")' > CHECKSUMS.txt
          gh release edit "${TAG}" -R "${GITHUB_REPOSITORY}" --notes-file CHECKSUMS.txt
