name: Build Project
on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.check-event.outputs.pluginName }}
      releaseTag:
        description: Release the build jobs attach their files to (empty when not a release tag)
        value: ${{ jobs.check-event.outputs.releaseTag }}
jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
      releaseTag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Event Data ☑️
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:true' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

          plugin_name="$(grep 'name' buildspec.json | sed -E -e 's/^.+"name":[^"]+"(.+)",?$/\1/g')"
          plugin_display_name="$(grep 'displayName' buildspec.json | sed -E -e 's/^.+"displayName":[^"]+"(.+)",?$/\1/g' || echo "")"

          if [[ "${plugin_display_name}" ]]; then
            echo "pluginName=${plugin_display_name}" >> $GITHUB_OUTPUT
          else
            echo "pluginName=${plugin_name}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release 🛫
        id: release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_NAME: ${{ steps.setup.outputs.pluginName }}
        run: |
          : Create Release 🛫
          # Published before any build starts: each platform job attaches its
          # own files the moment it finishes, so a finished platform never
          # waits for the slowest one. push.yaml adds the checksums at the end.
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) ) prerelease=() ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) ) prerelease=(--prerelease) ;;
            *) exit 0 ;;
          esac

          gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" > /dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --verify-tag "${prerelease[@]}" \
              --title "${PLUGIN_NAME} ${GITHUB_REF_NAME}" \
              --notes 'Builds are attached as each platform finishes.'
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

  unit-tests:
    name: Unit Tests 🧪 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # pipeline_stress_tests' and pipeline_gop_stress_tests' timing checks
      # (exact frame shown, lag after a render pause, a slow decoder keeping
      # up, the graphics thread's calls) use their looser CI limits: shared
      # runners, macOS above all, don't always keep their 4 ms steps, and this
      # job gates create-release. Their correctness checks stay strict. See
      # the headers of tests/pipeline_stress_tests.cpp and
      # tests/pipeline_gop_stress_tests.cpp.
      TRIGGLOW_STRESS_CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and Run Unit Tests 🧪
        run: |
          : Build and Run Unit Tests 🧪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # tests/CMakeLists.txt configures on its own (no libobs, Qt or
          # FFmpeg), so this job downloads no OBS dependencies. Being part of
          # this reusable workflow, it also gates push.yaml's create-release.
          cmake -S tests -B build_tests
          cmake --build build_tests --config RelWithDebInfo --parallel
          ctest --test-dir build_tests --build-config RelWithDebInfo --output-on-failure

  unit-tests-tsan:
    name: Unit Tests 🧪 (ThreadSanitizer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # The stress test's looser CI timing limits (see the unit-tests job):
      # under TSAN's 5-15x slowdown the strict ones fail without a race.
      TRIGGLOW_STRESS_CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Threaded Unit Tests with ThreadSanitizer 🧪
        run: |
          : Build Threaded Unit Tests with ThreadSanitizer 🧪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # The suites around the codec worker threads (src/frame-arena.*,
          # src/frame-ring.*, src/codec-pipeline.*, with the stamp codec and
          # the fake inter-frame one) and the background jobs' lifecycle
          # (src/cancel-token.*, src/background-tasks.*), built with GCC like
          # the Ubuntu plugin build. A build failure here is a real error, so
          # this step is allowed to fail the job.
          cmake -S tests -B build_tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'
          cmake --build build_tsan --parallel \
            --target frame_arena_tests frame_ring_tests pipeline_stress_tests pipeline_gop_stress_tests \
              background_tasks_tests

      - name: Run Threaded Unit Tests under ThreadSanitizer 🧪
        # Deliberately non-blocking. This job is part of this reusable
        # workflow, so a failure here would also block push.yaml's
        # create-release, and TSAN can fail for reasons that are not races in
        # this code: false positives on what it can't see into (libstdc++.so is
        # not built with -fsanitize=thread, standalone std::atomic_thread_fence
        # is not modeled) and its 5-15x slowdown, which can trip the stress
        # test's timing checks even with their CI limits (TRIGGLOW_STRESS_CI
        # above). The unit-tests job above is the gate; this step only
        # reports: a warning annotation on the run and a summary on the job
        # page, which the release checklist reviews before a draft release is
        # published. Once it has run clean for a few releases, drop
        # continue-on-error so it gates too.
        continue-on-error: true
        env:
          TSAN_OPTIONS: halt_on_error=0 second_deadlock_stack=1 exitcode=66
        run: |
          : Run Threaded Unit Tests under ThreadSanitizer 🧪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # TSAN's shadow memory layout breaks under the high-entropy ASLR of
          # recent kernels ("FATAL: ThreadSanitizer: unexpected memory
          # mapping"). The runner images set 28 bits; make sure of it.
          sudo sysctl -w vm.mmap_rnd_bits=28

          set +e
          ctest --test-dir build_tsan --output-on-failure --timeout 600 \
            --tests-regex '^(frame_arena|frame_ring|pipeline_stress|pipeline_gop_stress|background_tasks)_tests$' \
            2>&1 | tee tsan.log
          status=${PIPESTATUS[0]}
          set -e

          reports=$(grep -c '^WARNING: ThreadSanitizer' tsan.log || true)
          {
            echo '### ThreadSanitizer: frame_arena, frame_ring, pipeline_stress, pipeline_gop_stress, background_tasks'
            echo
            echo "- ctest exit code: ${status}"
            echo "- ThreadSanitizer reports: ${reports}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( reports > 0 )); then
            echo "::warning title=ThreadSanitizer::${reports} report(s) in the threaded unit tests. Review this job's log before publishing a release."
          elif (( status != 0 )); then
            echo "::warning title=ThreadSanitizer::A threaded unit test failed under ThreadSanitizer without a TSAN report (likely a timing check under its slowdown). See this job's log."
          fi
          exit "${status}"

  macos-build:
    name: Build for macOS 🍏
    runs-on: macos-15
    needs: check-event
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          print '::group::Enable Xcode 16.1'
          sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer
          print '::endgroup::'

          print '::group::Clean Homebrew Environment'
          local -a unwanted_formulas=()
          local -a remove_formulas=()
          for formula (${unwanted_formulas}) {
            if [[ -d ${HOMEBREW_PREFIX}/Cellar/${formula} ]] remove_formulas+=(${formula})
          }

          if (( #remove_formulas )) brew uninstall --ignore-dependencies ${remove_formulas}
          print '::endgroup::'

          local product_name
          local product_version
          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          print "pluginName=${product_name}" >> $GITHUB_OUTPUT
          print "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Set Up Codesigning 🔑
        uses: ./.github/actions/setup-macos-codesigning
        if: fromJSON(needs.check-event.outputs.codesign)
        id: codesign
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          installerIdentity: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          keychainPassword: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          provisioningProfile: ${{ secrets.MACOS_SIGNING_PROVISIONING_PROFILE }}
          notarizationUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          notarizationPassword: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) && fromJSON(steps.codesign.outputs.haveCodesignIdent) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          installerIdent: ${{ steps.codesign.outputs.installerIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          notarize: ${{ fromJSON(needs.check-event.outputs.notarize) && fromJSON(steps.codesign.outputs.haveNotarizationUser) }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal.*

      - name: Attach to Release 🛫
        if: needs.check-event.outputs.releaseTag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Attach to Release 🛫
          gh release upload '${{ needs.check-event.outputs.releaseTag }}' -R '${{ github.repository }}' --clobber \
            release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal.(pkg|tar.xz)

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.check-event.outputs.config == 'Release' }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}-dSYMs
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-dSYMs.*

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}

  linux-build:
    name: Build for Linux 🐧
    runs-on: ubuntu-24.04
    needs: check-event
    # Built in a clean ubuntu:24.04, the oldest distro supported (glibc 2.39,
    # Qt 6.4), so the one .so runs on Ubuntu 24.04, 26.04 and 26.10, Debian 13,
    # Fedora and Arch. Not the runner image itself: its extra toolchains and
    # libraries could leak newer symbol versions into the plugin. Paths are
    # relative: in a container job github.workspace is the host's path.
    # Pinned by digest (the image index, every architecture): a moved tag
    # can't change the build environment unnoticed. Update it with
    # `docker buildx imagetools inspect ubuntu:24.04`.
    container: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    defaults:
      run:
        shell: bash
    outputs:
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
    steps:
      - name: Install Git 🛍️
        run: |
          : Install Git 🛍️
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          .github/scripts/linux/install-build-deps.sh

          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: ffmpeg-cache
        with:
          path: .deps/ffmpeg-linux-x86_64
          key: linux-ffmpeg-x86_64-${{ hashFiles('buildspec.json', '.github/scripts/linux/build-ffmpeg.sh') }}

      - name: Build FFmpeg (static, LGPL, MJPEG only) 🎞️
        run: |
          : Build FFmpeg 🎞️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # Builds the pinned, hash-checked source and fails on a GPL,
          # version 3 or nonfree configuration (the licence guard). A cache
          # hit is only reused when its stamp matches the pin and the script.
          .github/scripts/linux/build-ffmpeg.sh

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: ccache-cache
        with:
          path: .ccache
          key: linux-ubuntu-24.04-ccache-x86_64-${{ needs.check-event.outputs.config }}
          restore-keys: |
            linux-ubuntu-24.04-ccache-x86_64-

      - name: Build Plugin 🧱
        run: |
          : Build Plugin 🧱
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          .github/scripts/linux/build.sh ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        run: |
          : Package Plugin 📀
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # .deb, .rpm, .pkg.tar.zst and the per-user .tar.xz. Also stops on
          # a shared FFmpeg, an exported FFmpeg symbol, an RPATH, or a glibc
          # newer than Ubuntu 24.04's.
          .github/scripts/linux/package.sh

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-linux-sources-${{ needs.check-event.outputs.commitHash }}
          # The plugin's source and, for the LGPL, the exact source of the
          # FFmpeg linked into the Linux .so (package.sh). push.yaml's
          # create-release attaches both to the release.
          if-no-files-found: error
          path: |
            release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-source.*
            release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-ffmpeg-*-source.tar.xz

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-linux-x86_64-${{ needs.check-event.outputs.commitHash }}
          if-no-files-found: error
          path: |
            release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64-linux-gnu.deb
            release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64-linux-gnu.rpm
            release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64-linux-gnu.pkg.tar.zst
            release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64-linux-gnu.tar.xz

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-linux-x86_64-${{ needs.check-event.outputs.commitHash }}-dbgsym
          path: release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64-linux-gnu-dbgsym.tar.xz

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: linux-ubuntu-24.04-ccache-x86_64-${{ needs.check-event.outputs.config }}

  linux-verify:
    name: Verify Linux Package 🐧 (${{ matrix.distro }}, ${{ matrix.family }})
    runs-on: ubuntu-24.04
    needs: [check-event, linux-build]
    # Installs each package in a clean container the way a user would (apt,
    # dnf, pacman resolving the dependencies; the .tar.xz's install.sh as an
    # ordinary user), then checks the installed .so: every library found
    # (ldd), every symbol resolved (ldd -r), no FFmpeg symbol exported (nm -D)
    # and the OBS 31/32 legacy paths linking to the OBS 33 ones. Debian 13's
    # own OBS (30.2) is below the minimum: there the .deb must refuse to
    # install, which is what that run checks (.github/scripts/linux/verify-package.sh).
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Images pinned by digest (image index) like the build's; Fedora 44 is
        # what fedora:latest was when pinned. Arch is rolling: its digest
        # fixes the base, and pacman -Syu still brings it up to date.
        include:
          - distro: ubuntu:24.04
            image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
            family: deb
          - distro: ubuntu:26.04
            image: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
            family: deb
          - distro: ubuntu:26.04
            image: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
            family: user
          - distro: debian:13
            image: debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
            family: deb
          - distro: fedora:44
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            family: rpm
          - distro: archlinux
            image: archlinux:latest@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
            family: pacman
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.linux-build.outputs.pluginName }}-${{ needs.linux-build.outputs.pluginVersion }}-linux-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: packages

      - name: Install and Check 🔍
        run: |
          : Install and Check 🔍
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          bash .github/scripts/linux/verify-package.sh ${{ matrix.family }} packages

  linux-release:
    name: Attach Linux Packages to Release 🛫
    # After the package checks, so a release never carries a Linux package
    # that failed to install. The build container has no gh, hence its own job.
    if: needs.check-event.outputs.releaseTag != ''
    runs-on: ubuntu-24.04
    needs: [check-event, linux-build, linux-verify]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # The packages and the sources, not the -dbgsym artifact.
          pattern: ${{ needs.linux-build.outputs.pluginName }}-${{ needs.linux-build.outputs.pluginVersion }}-linux-*-${{ needs.check-event.outputs.commitHash }}
          merge-multiple: true
          path: assets

      - name: Attach to Release 🛫
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Attach to Release 🛫
          gh release upload '${{ needs.check-event.outputs.releaseTag }}' -R '${{ github.repository }}' --clobber assets/*

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $ProductName = $BuildSpec.name
          $ProductVersion = $BuildSpec.version

          "pluginName=${ProductName}" >> $env:GITHUB_OUTPUT
          "pluginVersion=${ProductVersion}" >> $env:GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Check FFmpeg License 🔍
        run: |
          # Check FFmpeg License 🔍
          #
          # The plugin ships avcodec, avutil and swresample next to its DLL
          # under the LGPL (data/licenses/LICENSE-ffmpeg.txt). A GPL or nonfree
          # build in buildspec.json would make that notice wrong, and a nonfree
          # one unredistributable: this fails the build if the avcodec DLL of
          # the FFmpeg it just downloaded was configured with --enable-gpl or
          # --enable-nonfree, or doesn't report an LGPL license. Only whole
          # tokens of FFmpeg's own configure line (the one naming --target-os)
          # count, so other strings in the DLL (a codec library's options, a
          # help text) can't trip it.
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          # The printable ASCII run around position $at (one C string of the DLL).
          function Get-StringAt([string]$text, [int]$at) {
            $start = $at
            while ( $start -gt 0 -and $text[$start - 1] -ge ' ' -and $text[$start - 1] -le '~' ) { $start-- }
            $end = $at
            while ( $end -lt $text.Length -and $text[$end] -ge ' ' -and $text[$end] -le '~' ) { $end++ }
            return $text.Substring($start, $end - $start)
          }

          $dlls = Get-ChildItem -Path .deps/ffmpeg-windows-x64 -Recurse -Filter 'avcodec-*.dll'
          if ( -not $dlls ) {
            throw 'No avcodec DLL under .deps/ffmpeg-windows-x64: the FFmpeg dependency was not downloaded.'
          }
          foreach ( $dll in $dlls ) {
            # Latin-1: one char per byte, nothing above 0x7E taken for text.
            $text = [Text.Encoding]::GetEncoding(28591).GetString([IO.File]::ReadAllBytes($dll.FullName))
            $at = $text.IndexOf('libavcodec license: ', [StringComparison]::Ordinal)
            $license = if ( $at -ge 0 ) { Get-StringAt $text $at } else { '' }
            $configs = @()
            $at = $text.IndexOf('--target-os=', [StringComparison]::Ordinal)
            while ( $at -ge 0 ) {
              $configs += Get-StringAt $text $at
              $at = $text.IndexOf('--target-os=', $at + 1, [StringComparison]::Ordinal)
            }
            if ( -not $license -or $configs.Count -eq 0 ) {
              throw "$($dll.Name): no license or configuration string found, the FFmpeg build can't be checked."
            }
            $bad = @($configs | ForEach-Object { -split $_ } | Where-Object { $_ -in '--enable-gpl', '--enable-nonfree' })
            Write-Host "$($dll.Name): $license; configuration checked"
            if ( $bad.Count -gt 0 -or $license -notmatch '^libavcodec license: LGPL version' ) {
              throw "$($dll.Name) is not an LGPL build ($license; $($bad -join ' ')): the plugin may only ship an LGPL FFmpeg."
            }
          }

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Build Windows Installer 📦
        if: fromJSON(needs.check-event.outputs.package)
        run: |
          # Build Windows Installer 📦
          # cmake --install lands under release/<config>/<target-name>/{bin,data}
          # (see cmake/windows/helpers.cmake install() DESTINATION rules) - the
          # zip's own root, not release/<config> itself.
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DPluginStageDir=${{ github.workspace }}\release\${{ needs.check-event.outputs.config }}\${{ steps.setup.outputs.pluginName }}" `
            "/DMyAppVersion=${{ steps.setup.outputs.pluginVersion }}" `
            "${{ github.workspace }}\installers\windows\trigglow-dynamic-delay-setup.iss"

      - name: Sign Windows Installer (self-signed) 🔏
        if: fromJSON(needs.check-event.outputs.package)
        env:
          SELFSIGN_PFX_BASE64: ${{ secrets.WINDOWS_SELFSIGN_PFX_BASE64 }}
          SELFSIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SELFSIGN_PFX_PASSWORD }}
        run: |
          # Sign Windows Installer (self-signed) 🔏
          #
          # IMPORTANT: this is a SELF-signed certificate, not one issued by a trusted CA
          # (see docs/ROADMAP.md and issue #10 for the real fix this is a stopgap for,
          # not a replacement of). It proves the installer wasn't tampered with after
          # this exact CI run produced it -- it does NOT remove the SmartScreen "Unknown
          # publisher" warning and does NOT feed Microsoft Defender's cloud reputation
          # system, since neither trusts a self-issued identity. Real fix: a CA-issued
          # certificate (SignPath Foundation application in progress, see #10).
          #
          # No-ops (skips signing, doesn't fail the build) if the secrets below aren't
          # configured on this repo yet.
          if ( -not $Env:SELFSIGN_PFX_BASE64 ) {
            Write-Host "WINDOWS_SELFSIGN_PFX_BASE64 not set -- skipping self-sign step (see issue #10)."
            exit 0
          }

          $installer = Get-ChildItem -Path "${{ github.workspace }}\release" -Filter "*-windows-x64-setup.exe" |
            Select-Object -First 1
          if ( -not $installer ) {
            Write-Host "No installer .exe found under release\ -- nothing to sign."
            exit 0
          }

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ( -not $signtool ) {
            throw "signtool.exe not found under the Windows SDK on this runner."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "selfsign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($Env:SELFSIGN_PFX_BASE64))
          try {
            & $signtool.FullName sign /f $pfxPath /p $Env:SELFSIGN_PFX_PASSWORD /fd SHA256 `
              /tr "http://timestamp.digicert.com" /td SHA256 `
              /d "${{ steps.setup.outputs.pluginName }}" $installer.FullName
            if ( $LASTEXITCODE -ne 0 ) {
              throw "signtool sign failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build Studio Core 🎛️
        if: fromJSON(needs.check-event.outputs.package)
        run: |
          # Build Studio Core 🎛️
          #
          # The core build (-DTRIGGLOW_CORE_ONLY=ON, src/core-main.cpp): only the
          # two delay filters, for Trigglow Studio's engine, which loads it like
          # any libobs plugin and drives the filters itself. Packed in the
          # engine's own layout (obs-plugins/64bit + data/obs-plugins/<name>) so
          # the Trigglow app's `studio:fetch` unpacks it straight into it. Reuses
          # .deps from the main build.
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          $config = '${{ needs.check-event.outputs.config }}'
          $plugin = '${{ steps.setup.outputs.pluginName }}'
          $core = "${plugin}-core"
          cmake --preset windows-ci-x64 -B build_core -DTRIGGLOW_CORE_ONLY=ON
          if ( $LASTEXITCODE -ne 0 ) { throw 'core configure failed' }
          cmake --build build_core --config $config
          if ( $LASTEXITCODE -ne 0 ) { throw 'core build failed' }
          cmake --install build_core --config $config --prefix build_core/pkg
          if ( $LASTEXITCODE -ne 0 ) { throw 'core install failed' }

          $src = "build_core/pkg/${plugin}"
          $stage = 'build_core/studio'
          $bin = New-Item -ItemType Directory -Force -Path "${stage}/obs-plugins/64bit"
          $data = New-Item -ItemType Directory -Force -Path "${stage}/data/obs-plugins/${core}"
          Copy-Item -Path "${src}/bin/64bit/${core}.dll", "${src}/bin/64bit/avcodec-*.dll", "${src}/bin/64bit/avutil-*.dll", "${src}/bin/64bit/swresample-*.dll" -Destination $bin
          Copy-Item -Path "${src}/data/locale", "${src}/data/licenses" -Destination $data -Recurse
          Compress-Archive -Path "${stage}/*" -DestinationPath "release/${plugin}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-studio-core.zip"

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*

      - name: Attach to Release 🛫
        if: needs.check-event.outputs.releaseTag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Attach to Release 🛫
          $files = @(Get-ChildItem -Path release -File |
            Where-Object Name -match '-windows-x64.*\.(zip|exe)$' |
            ForEach-Object FullName)
          if ( $files.Count -eq 0 ) { throw 'No Windows zip/exe under release\ to attach.' }
          gh release upload '${{ needs.check-event.outputs.releaseTag }}' -R '${{ github.repository }}' --clobber @files
          if ( $LASTEXITCODE -ne 0 ) { throw "gh release upload failed with exit code $LASTEXITCODE" }
