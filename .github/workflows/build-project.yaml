name: Build Project
on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.check-event.outputs.pluginName }}
jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Event Data ☑️
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:true' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

          plugin_name="$(grep 'name' buildspec.json | sed -E -e 's/^.+"name":[^"]+"(.+)",?$/\1/g')"
          plugin_display_name="$(grep 'displayName' buildspec.json | sed -E -e 's/^.+"displayName":[^"]+"(.+)",?$/\1/g' || echo "")"

          if [[ "${plugin_display_name}" ]]; then
            echo "pluginName=${plugin_display_name}" >> $GITHUB_OUTPUT
          else
            echo "pluginName=${plugin_name}" >> $GITHUB_OUTPUT
          fi

  unit-tests:
    name: Unit Tests 🧪 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # pipeline_stress_tests' timing checks (exact frame shown, lag after a
      # render pause, a slow decoder keeping up) use their looser CI limits:
      # shared runners, macOS above all, don't always keep its 4 ms steps,
      # and this job gates create-release. Its correctness checks stay strict.
      # See the header of tests/pipeline_stress_tests.cpp.
      TRIGGLOW_STRESS_CI: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Unit Tests 🧪
        run: |
          : Build and Run Unit Tests 🧪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # tests/CMakeLists.txt configures on its own (no libobs, Qt or
          # FFmpeg), so this job downloads no OBS dependencies. Being part of
          # this reusable workflow, it also gates push.yaml's create-release.
          cmake -S tests -B build_tests
          cmake --build build_tests --config RelWithDebInfo --parallel
          ctest --test-dir build_tests --build-config RelWithDebInfo --output-on-failure

  unit-tests-tsan:
    name: Unit Tests 🧪 (ThreadSanitizer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # The stress test's looser CI timing limits (see the unit-tests job):
      # under TSAN's 5-15x slowdown the strict ones fail without a race.
      TRIGGLOW_STRESS_CI: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Build Threaded Unit Tests with ThreadSanitizer 🧪
        run: |
          : Build Threaded Unit Tests with ThreadSanitizer 🧪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # The suites around the codec worker threads (src/frame-arena.*,
          # src/frame-ring.*, src/codec-pipeline.*) and the background jobs'
          # lifecycle (src/cancel-token.*, src/background-tasks.*), built with
          # GCC like the Ubuntu plugin build. A build failure here is a real
          # error, so this step is allowed to fail the job.
          cmake -S tests -B build_tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'
          cmake --build build_tsan --parallel \
            --target frame_arena_tests frame_ring_tests pipeline_stress_tests background_tasks_tests

      - name: Run Threaded Unit Tests under ThreadSanitizer 🧪
        # Deliberately non-blocking. This job is part of this reusable
        # workflow, so a failure here would also block push.yaml's
        # create-release, and TSAN can fail for reasons that are not races in
        # this code: false positives on what it can't see into (libstdc++.so is
        # not built with -fsanitize=thread, standalone std::atomic_thread_fence
        # is not modeled) and its 5-15x slowdown, which can trip the stress
        # test's timing checks even with their CI limits (TRIGGLOW_STRESS_CI
        # above). The unit-tests job above is the gate; this step only
        # reports: a warning annotation on the run and a summary on the job
        # page, which the release checklist reviews before a draft release is
        # published. Once it has run clean for a few releases, drop
        # continue-on-error so it gates too.
        continue-on-error: true
        env:
          TSAN_OPTIONS: halt_on_error=0 second_deadlock_stack=1 exitcode=66
        run: |
          : Run Threaded Unit Tests under ThreadSanitizer 🧪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          # TSAN's shadow memory layout breaks under the high-entropy ASLR of
          # recent kernels ("FATAL: ThreadSanitizer: unexpected memory
          # mapping"). The runner images set 28 bits; make sure of it.
          sudo sysctl -w vm.mmap_rnd_bits=28

          set +e
          ctest --test-dir build_tsan --output-on-failure --timeout 600 \
            --tests-regex '^(frame_arena|frame_ring|pipeline_stress|background_tasks)_tests$' 2>&1 | tee tsan.log
          status=${PIPESTATUS[0]}
          set -e

          reports=$(grep -c '^WARNING: ThreadSanitizer' tsan.log || true)
          {
            echo '### ThreadSanitizer: frame_arena, frame_ring, pipeline_stress, background_tasks'
            echo
            echo "- ctest exit code: ${status}"
            echo "- ThreadSanitizer reports: ${reports}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( reports > 0 )); then
            echo "::warning title=ThreadSanitizer::${reports} report(s) in the threaded unit tests. Review this job's log before publishing a release."
          elif (( status != 0 )); then
            echo "::warning title=ThreadSanitizer::A threaded unit test failed under ThreadSanitizer without a TSAN report (likely a timing check under its slowdown). See this job's log."
          fi
          exit "${status}"

  macos-build:
    name: Build for macOS 🍏
    runs-on: macos-15
    needs: check-event
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          print '::group::Enable Xcode 16.1'
          sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer
          print '::endgroup::'

          print '::group::Clean Homebrew Environment'
          local -a unwanted_formulas=()
          local -a remove_formulas=()
          for formula (${unwanted_formulas}) {
            if [[ -d ${HOMEBREW_PREFIX}/Cellar/${formula} ]] remove_formulas+=(${formula})
          }

          if (( #remove_formulas )) brew uninstall --ignore-dependencies ${remove_formulas}
          print '::endgroup::'

          local product_name
          local product_version
          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          print "pluginName=${product_name}" >> $GITHUB_OUTPUT
          print "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Set Up Codesigning 🔑
        uses: ./.github/actions/setup-macos-codesigning
        if: fromJSON(needs.check-event.outputs.codesign)
        id: codesign
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          installerIdentity: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          keychainPassword: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          provisioningProfile: ${{ secrets.MACOS_SIGNING_PROVISIONING_PROFILE }}
          notarizationUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          notarizationPassword: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) && fromJSON(steps.codesign.outputs.haveCodesignIdent) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          installerIdent: ${{ steps.codesign.outputs.installerIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          notarize: ${{ fromJSON(needs.check-event.outputs.notarize) && fromJSON(steps.codesign.outputs.haveNotarizationUser) }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@v4
        if: ${{ needs.check-event.outputs.config == 'Release' }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}-dSYMs
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-dSYMs.*

      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}

  ubuntu-build:
    name: Build for Ubuntu 🐧
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-sources-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-source.*

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*.*

      - name: Upload debug symbol artifacts 🪲
        uses: actions/upload-artifact@v4
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}-dbgsym
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*-dbgsym.ddeb

      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $ProductName = $BuildSpec.name
          $ProductVersion = $BuildSpec.version

          "pluginName=${ProductName}" >> $env:GITHUB_OUTPUT
          "pluginVersion=${ProductVersion}" >> $env:GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Build Windows Installer 📦
        if: fromJSON(needs.check-event.outputs.package)
        run: |
          # Build Windows Installer 📦
          # cmake --install lands under release/<config>/<target-name>/{bin,data}
          # (see cmake/windows/helpers.cmake install() DESTINATION rules) - the
          # zip's own root, not release/<config> itself.
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DPluginStageDir=${{ github.workspace }}\release\${{ needs.check-event.outputs.config }}\${{ steps.setup.outputs.pluginName }}" `
            "/DMyAppVersion=${{ steps.setup.outputs.pluginVersion }}" `
            "${{ github.workspace }}\installers\windows\trigglow-dynamic-delay-setup.iss"

      - name: Sign Windows Installer (self-signed) 🔏
        if: fromJSON(needs.check-event.outputs.package)
        env:
          SELFSIGN_PFX_BASE64: ${{ secrets.WINDOWS_SELFSIGN_PFX_BASE64 }}
          SELFSIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SELFSIGN_PFX_PASSWORD }}
        run: |
          # Sign Windows Installer (self-signed) 🔏
          #
          # IMPORTANT: this is a SELF-signed certificate, not one issued by a trusted CA
          # (see docs/ROADMAP.md and issue #10 for the real fix this is a stopgap for,
          # not a replacement of). It proves the installer wasn't tampered with after
          # this exact CI run produced it -- it does NOT remove the SmartScreen "Unknown
          # publisher" warning and does NOT feed Microsoft Defender's cloud reputation
          # system, since neither trusts a self-issued identity. Real fix: a CA-issued
          # certificate (SignPath Foundation application in progress, see #10).
          #
          # No-ops (skips signing, doesn't fail the build) if the secrets below aren't
          # configured on this repo yet.
          if ( -not $Env:SELFSIGN_PFX_BASE64 ) {
            Write-Host "WINDOWS_SELFSIGN_PFX_BASE64 not set -- skipping self-sign step (see issue #10)."
            exit 0
          }

          $installer = Get-ChildItem -Path "${{ github.workspace }}\release" -Filter "*-windows-x64-setup.exe" |
            Select-Object -First 1
          if ( -not $installer ) {
            Write-Host "No installer .exe found under release\ -- nothing to sign."
            exit 0
          }

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ( -not $signtool ) {
            throw "signtool.exe not found under the Windows SDK on this runner."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "selfsign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($Env:SELFSIGN_PFX_BASE64))
          try {
            & $signtool.FullName sign /f $pfxPath /p $Env:SELFSIGN_PFX_PASSWORD /fd SHA256 `
              /tr "http://timestamp.digicert.com" /td SHA256 `
              /d "${{ steps.setup.outputs.pluginName }}" $installer.FullName
            if ( $LASTEXITCODE -ne 0 ) {
              throw "signtool sign failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
