# --- Dock: aviso de degradación del buffer (tarjeta de estado, con el delay en marcha) ---
# Se muestra mientras el buffer va por debajo de la calidad completa para no
# quedarse atrás; el delay en sí nunca cambia. Título y una de las cuatro frases.
Dock.Health.Title="Calidad del buffer reducida"
# %1×%2 lo que se guarda ahora, %3×%4 el tamaño completo, %5 la causa (Dock.Health.Cause.*), %6 los segundos de delay.
Dock.Health.Resolution="El buffer guarda a %1×%2 en vez de %3×%4 porque %5. Tu delay de %6 s sigue intacto."
# %1 los fps que se capturan ahora, %2 los completos, %3 la causa, %4 los segundos de delay.
Dock.Health.FrameRate="El buffer captura %1 fps en vez de %2 fps porque %3. Tu delay de %4 s sigue intacto."
# Las dos cosas: %1×%2 a %3 fps ahora, %4×%5 a %6 fps completos, %7 la causa, %8 los segundos de delay.
Dock.Health.Both="El buffer guarda a %1×%2 y %3 fps en vez de %4×%5 y %6 fps porque %7. Tu delay de %8 s sigue intacto."
# Reducido de otra forma: %1 la causa, %2 los segundos de delay.
Dock.Health.Other="El buffer se ha aligerado porque %1. Tu delay de %2 s sigue intacto."
Dock.Health.Cause.Graphics="el hilo gráfico de OBS va muy cargado"
Dock.Health.Cause.Encode="comprimir los fotogramas consume mucha CPU"
Dock.Health.Cause.Decode="descomprimir los fotogramas consume mucha CPU"
Dock.Health.Cause.Other="el equipo va muy cargado"
# Letra pequeña bajo el aviso, solo con alguna tasa por encima de 0 (en los
# últimos 10 s). Las dos se ven en el directo como un fotograma repetido, nunca
# como un cambio del delay.
Dock.Health.Repeated="%1 fotogramas repetidos por minuto"
Dock.Health.Dropped="%1 fotogramas descartados por minuto"
Dock.Health.RepeatedDropped="%1 fotogramas repetidos y %2 descartados por minuto"
# Se anuncia a los lectores de pantalla cuando el aviso desaparece con el delay aún en marcha.
Dock.Health.Restored="El buffer vuelve a la calidad completa."

