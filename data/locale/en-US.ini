# --- Dock: buffer degradation notice (status card, while the delay runs) ---
# Shown while the buffer runs below full quality to keep up with the computer;
# the delay itself never changes. Title, then one of the four sentences below.
Dock.Health.Title="Buffer quality lowered"
# %1×%2 buffered now, %3×%4 the full size, %5 the cause (Dock.Health.Cause.*), %6 the delay in seconds.
Dock.Health.Resolution="Buffering at %1×%2 instead of %3×%4 because %5. Your %6 s delay is unchanged."
# %1 fps captured now, %2 fps the full rate, %3 the cause, %4 the delay in seconds.
Dock.Health.FrameRate="Capturing %1 fps instead of %2 fps because %3. Your %4 s delay is unchanged."
# Both lowered: %1×%2 at %3 fps now, %4×%5 at %6 fps full, %7 the cause, %8 the delay in seconds.
Dock.Health.Both="Buffering at %1×%2 and %3 fps instead of %4×%5 and %6 fps because %7. Your %8 s delay is unchanged."
# Lowered in some other way: %1 the cause, %2 the delay in seconds.
Dock.Health.Other="The buffer was lightened because %1. Your %2 s delay is unchanged."
Dock.Health.Cause.Graphics="OBS's graphics thread is under heavy load"
Dock.Health.Cause.Encode="compressing the frames takes a lot of CPU"
Dock.Health.Cause.Decode="decompressing the frames takes a lot of CPU"
Dock.Health.Cause.Other="the computer is under heavy load"
# Fine print under the notice, only with a rate above 0 (over the last 10 s).
# Either shows on stream as a repeated frame, never as a change of the delay.
Dock.Health.Repeated="%1 repeated frames per minute"
Dock.Health.Dropped="%1 dropped frames per minute"
Dock.Health.RepeatedDropped="%1 repeated and %2 dropped frames per minute"
# Announced to screen readers when the notice goes away with the delay still on.
Dock.Health.Restored="Buffer back to full quality."

