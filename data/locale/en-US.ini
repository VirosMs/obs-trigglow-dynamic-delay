PluginName="Trigglow Dynamic Delay"

# Style: second person, short sentences, sentence case (capitals come from the
# UI's fonts, never from the string), no glyphs as icons (the dock draws SVG
# icons), "…" as one character, "30 s" with a no-break space, "×" in
# resolutions. "Dynamic Delay" is the product name and is never translated.
# The names of the objects the plugin creates in OBS (scene, filters, overlay
# source) are NOT here: OBS finds them by name, so they are fixed English
# constants in src/auto-names.hpp.

# --- Filters (filter type names in OBS's Filters dialog) ---
Filter.VideoDelay.Name="Trigglow: Video delay buffer"
Filter.AudioDelay.Name="Trigglow: Audio delay buffer"
# The filters' properties (OBS's Filters dialog): the dock manages both filters, so they have no fields.
Filter.VideoDelay.Managed="Managed by the Trigglow Dynamic Delay dock: set the delay and the minimum quality there, and turn the delay on or off there too."
Filter.AudioDelay.Managed="Managed by the Trigglow Dynamic Delay dock: it follows the video delay. Turn the delay on or off from the dock."

# --- Hotkeys (Settings > Hotkeys) ---
Hotkey.Toggle="Trigglow: Toggle Dynamic Delay"
Hotkey.Enable="Trigglow: Enable Dynamic Delay"
Hotkey.Disable="Trigglow: Disable Dynamic Delay"

# --- Buffer status messages (BufferModeController, the status card's detail line) ---
Status.LoginRequired="Sign in with your free Trigglow account to turn on the delay."
Status.ChooseLiveScene="Choose your live scene first."
Status.WrapperSceneFailed="Couldn't create the helper scene. Check the OBS log or report a problem."
Status.Filling="Saving %1 s of stream before applying the delay."
# The RAM budget trimmed the delay: %1 is what applies, %2 what the user set.
Status.FillingTrimmed="Saving %1 s of stream before applying the delay: only %1 of your %2 s fit in RAM."
# The delay was on (or preparing) when OBS switched scene collection; the delay stays with the previous one.
Status.CollectionChanged="The delay turned off because you switched scene collection. Turn it on again when you're ready."

